name: Update GitHub Profile Stats

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: "0 3 * * *"

  # Allows you to run it manually from the Actions tab
  workflow_dispatch:

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=default&hide_border=true&title_color=B23A34&icon_color=3E6E8E&text_color=2E2A26&bg_color=FBF8EE
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Daily R Learning Update

on:
  schedule:
    # Runs every day at 6:00 PM UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update learning log
        run: |
          mkdir -p progress
          echo "- $(date -u '+%Y-%m-%d'): Daily R learning update" >> progress/learning-log.md

      - name: Commit changes
        run: |
          git add progress/learning-log.md
          git diff --cached --quiet || git commit -m "docs: update daily R learning progress"
          git push

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "chore: update GitHub profile stats"

          git push
