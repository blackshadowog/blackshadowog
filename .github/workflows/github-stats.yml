name: Daily R Learning Update

on:
  schedule:
    # Runs every day at 6:00 PM UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update learning log
        run: |
          mkdir -p progress
          echo "- $(date -u '+%Y-%m-%d'): Daily R learning update" >> progress/learning-log.md

      - name: Commit changes
        run: |
          git add progress/learning-log.md
          git diff --cached --quiet || git commit -m "docs: update daily R learning progress"
          git push
